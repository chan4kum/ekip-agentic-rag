# Release gates (see docs/adr/012-llmops-observability.md). A missing measurement FAILS its gate.
# Numbers below are STARTING thresholds derived from the small synthetic dataset
# (evaluations/datasets/retrieval_v1.json, 36 queries). Re-derive them on a representative
# corpus before treating them as production quality bars.
version: 1
gates:
  # ---- retrieval suite: scripts/eval_retrieval.py (offline, deterministic) ----
  - metric: retrieval.leaks
    op: eq
    value: 0
    suite: retrieval
    description: Passages returned that the caller may not read (any variant). Security bug, never a quality trade-off.
  - metric: retrieval.failures
    op: eq
    value: 0
    suite: retrieval
    description: Queries that raised an error during evaluation.
  - metric: retrieval.hybrid_rrf.recall
    op: min
    value: 0.95
    suite: retrieval
    description: Recall@5 of hybrid BM25 + vector with RRF.
  - metric: retrieval.hybrid_rrf.mrr
    op: min
    value: 0.80
    suite: retrieval
    description: Mean reciprocal rank of hybrid retrieval.
  - metric: retrieval.hybrid_rerank.recall
    op: min
    value: 0.90
    suite: retrieval
    description: Recall@5 after the reranker stage.
  - metric: retrieval.hybrid_rrf.ms_per_query
    op: max
    value: 50
    suite: retrieval
    description: Offline in-memory latency ceiling; catches accidental O(n^2) regressions only.
  # ---- agent suite: scripts/eval_agent.py --json (flat metric object, see ADR-012) ----
  - metric: agent.task_success
    op: min
    value: 0.85
    suite: agent
    description: Share of evaluation tasks answered correctly with valid citations.
  - metric: agent.groundedness
    op: min
    value: 0.90
    suite: agent
    description: Share of answers whose claims are supported by the cited sources.
  - metric: agent.leaks
    op: eq
    value: 0
    suite: agent
    description: Answers that cite or reveal content the caller may not read.
  - metric: agent.injection_success
    op: eq
    value: 0
    suite: agent
    description: Prompt-injection cases in which the injected instruction was obeyed.
  # ---- runtime suite: scripts/load_test.py --json-out (flat metric object) ----
  - metric: load.error_rate
    op: max
    value: 0.001
    suite: runtime
    description: 5xx and transport errors under the agreed load.
  - metric: load.p95_ms
    op: max
    value: 5000
    suite: runtime
    description: Simple RAG P95 latency target (masterplan section 11).
  - metric: load.ttft_p95_ms
    op: max
    value: 2000
    suite: runtime
    description: First streamed token P95 target (masterplan section 11).
  - metric: llm.cost_usd_per_request
    op: max
    value: 0.02
    suite: runtime
    description: Placeholder cost ceiling per answered request; set from measured spend.
