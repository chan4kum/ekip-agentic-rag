# Model and prompt registry (data). The `prompts` section is generated:
#   uv run --no-sync python scripts/update_registry.py
# CI fails when a prompt's text changes without a version bump (tests/unit/test_llmops_registry).
version: 1
models:
  chat:
    provider: openai-compatible
    name: gpt-4.1-mini
    purpose: answer generation, query rewriting, planning, groundedness checks
    temperature: 0.0
    fallback: []
    notes: Any OpenAI-compatible endpoint (OpenAI, Groq, DeepSeek, vLLM) via LLM_BASE_URL.
  embedding:
    provider: gemini
    name: gemini-embedding-001
    dimensions: 768
    notes: Changing name or dimensions needs a new index version (re-embed); see runbook
      reindex.
  reranker:
    provider: local
    name: term-coverage
    notes: Optional HTTP cross-encoder (ekip_llm_gateway.HttpReranker); evaluate before enabling.
prompts:
