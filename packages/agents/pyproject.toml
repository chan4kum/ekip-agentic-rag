[project]
name = "ekip-agents"
version = "0.1.0"
description = "Agent orchestration: typed state, LangGraph nodes and graphs"
requires-python = ">=3.12"
dependencies = ["ekip-contracts", "ekip-observability", "ekip-retrieval", "langgraph>=1.0,<2"]

[tool.uv.sources]
ekip-contracts = { workspace = true }
ekip-observability = { workspace = true }
ekip-retrieval = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
