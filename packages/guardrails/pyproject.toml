[project]
name = "ekip-guardrails"
version = "0.1.0"
description = "Input and output guardrails behind a GuardrailEngine port"
requires-python = ">=3.12"
dependencies = ["ekip-contracts", "ekip-observability"]

[tool.uv.sources]
ekip-contracts = { workspace = true }
ekip-observability = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
