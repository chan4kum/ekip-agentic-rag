[project]
name = "ekip-identity"
version = "0.1.0"
description = "OIDC access-token validation (JWKS cache, JWT checks) for EKIP"
requires-python = ">=3.12"
dependencies = ["ekip-contracts", "ekip-observability", "httpx>=0.27", "pyjwt[crypto]>=2.10"]

[tool.uv.sources]
ekip-contracts = { workspace = true }
ekip-observability = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
